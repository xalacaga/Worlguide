name: WorldGuide
options:
  bundleIdPrefix: com.xavierbegue

packages:
  WorldGuide:
    path: WorldGuide

targets:
  WorldGuide:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WorldGuideApp
    dependencies:
      - package: WorldGuide
        product: WGCore
      - package: WorldGuide
        product: WGConfiguration
      - package: WorldGuide
        product: WGPOI
      - package: WorldGuide
        product: WGContent
      - package: WorldGuide
        product: WGPlayback
      - package: WorldGuide
        product: WGLocation
      - package: WorldGuide
        product: WGWeather
      - package: WorldGuide
        product: WGAdapters
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "WorldGuide utilise votre position pour trouver les points d'intérêt à proximité."
        UIBackgroundModes:
          - audio
        WG_WIKIDATA_SPARQL_ENDPOINT: $(WG_WIKIDATA_SPARQL_ENDPOINT)
        WG_WIKIDATA_API_ENDPOINT: $(WG_WIKIDATA_API_ENDPOINT)
        WG_OVERPASS_ENDPOINT: $(WG_OVERPASS_ENDPOINT)
        WG_WIKIPEDIA_EXTRACT_ENDPOINT_TEMPLATE: $(WG_WIKIPEDIA_EXTRACT_ENDPOINT_TEMPLATE)
        WG_WEATHER_FORECAST_ENDPOINT: $(WG_WEATHER_FORECAST_ENDPOINT)
    configFiles:
      Debug: WorldGuide/Secrets.xcconfig
      Release: WorldGuide/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xavierbegue.worldguide
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X933D4P4FL

  WorldGuideAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WorldGuideAppTests
    dependencies:
      - target: WorldGuide
        embed: false
      - package: WorldGuide
        product: WGCore
      - package: WorldGuide
        product: WGPOI
      - package: WorldGuide
        product: WGContent
      - package: WorldGuide
        product: WGPlayback
      - package: WorldGuide
        product: WGLocation
      - package: WorldGuide
        product: WGWeather
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WorldGuide.app/WorldGuide"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  WorldGuide:
    build:
      targets:
        WorldGuide: all
        WorldGuideAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WorldGuideAppTests
